name: Validate

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: bash -n scripts/*.sh
      - run: python -m ruff check apps/core mcp_servers tests
      - run: python -m mypy apps/core/manny
      - run: python -m pytest

  arm64:
    # The device is a Raspberry Pi 5, which is aarch64. Every other job runs on x86-64, so
    # nothing here verified that the dependencies even resolve on the deployment
    # architecture — that was discovered on first boot, or not at all. This runs the real
    # suite on real ARM hardware rather than emulating it.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -c "import platform; print('arch:', platform.machine())"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - name: Load the raspberrypi profile on the target architecture
        run: |
          MANNY_CONFIG_PROFILE=raspberrypi python -c "
          from manny.config import Settings, _read_profile
          s = Settings(config_profile='raspberrypi', **_read_profile('raspberrypi'))
          print('profile ok:', s.llm_backend, s.llm_model, s.llm_base_url)
          "
        working-directory: .
        env:
          PYTHONPATH: apps/core
          # The profile selects remote_http, which the validator requires a URL for. That
          # rule is correct and fired here; on a device the URL comes from /opt/manny/.env,
          # so CI supplies a placeholder rather than weakening the check.
          MANNY_MCP_URL: https://example.invalid/mcp

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  audio-loopback:
    # Exercises the real ALSA adapters against snd-aloop, a kernel loopback sound
    # card. This is the only automated coverage the capture and playback paths
    # have; every other audio test runs against mocks. It does not replace a
    # Raspberry Pi, but it catches device-string and format mistakes that would
    # otherwise survive until first boot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Load the ALSA loopback driver
        id: loopback
        run: |
          sudo ./scripts/setup_audio_loopback.sh && echo "available=true" >> "$GITHUB_OUTPUT"             || echo "available=false" >> "$GITHUB_OUTPUT"
      - name: Report when the driver is unavailable
        if: steps.loopback.outputs.available != 'true'
        run: |
          echo "::warning title=Audio adapters unexercised::snd-aloop did not load, so the ALSA capture and playback tests skipped. The real audio path has no coverage in this run."
      - run: python -m pip install -e '.[dev]'
      - name: Exercise the capture and playback adapters
        run: python -m pytest tests/hardware -v
      - name: Round trip through verify_hardware.sh
        if: steps.loopback.outputs.available == 'true'
        env:
          MANNY_AUDIO_DEVICE: hw:Loopback,0,0
        run: |
          sudo apt-get install -y -qq espeak-ng
          ./scripts/verify_hardware.sh --quick || true
