environment: raspberrypi
hardware_mode: real
audio_device: default
mcp_mode: remote_http
camera_enabled: false
face_recognition_enabled: false
api_host: 127.0.0.1
api_port: 8765
log_level: INFO
data_directory: /opt/manny/data
stt_backend: whisper_cpp
tts_backend: espeak_ng
voice_default_language: auto
whisper_cpp_binary: /opt/manny/whisper.cpp/build/bin/whisper-cli
whisper_cpp_model: /opt/manny/models/ggml-base.bin
whisper_cpp_threads: 4
whisper_cpp_timeout_seconds: 90
espeak_ng_binary: /usr/bin/espeak-ng
llm_backend: ollama
llm_base_url: http://127.0.0.1:11434
# An Ollama tag, pulled by install_ollama_pi.sh. E2B is ~2B active parameters from a
# larger stored model, so its resident size depends on whether the runtime offloads
# the per-layer embeddings — check `ollama ps` on the device before trusting the
# memory ceiling. The model classifies intent and drafts wording only; the policy
# broker makes every MCP call (ADR-020).
llm_model: gemma4:e2b
llm_timeout_seconds: 60
llm_max_tokens: 320
# Four rather than six. Every turn is prompt tokens, which costs both prefill time
# and KV cache on a board where memory is the binding constraint. Retrieval covers
# what falls out of the window: MemoryStore.search pulls older facts back in when
# they are relevant, so a shorter window is not a shorter memory.
llm_context_turns: 4

# Camera deferred: no sensor selected yet, and vision is the largest latency and
# memory cost on the device. Set camera_enabled true and switch this to ollama to
# turn scene description on — no second server and no separate weights, because one
# daemon serves many models and this one is multimodal. Confirm the tag actually
# exposes vision first: `ollama show` reports it, and runtime support for image
# input has historically lagged the text path.
vision_language_backend: none
vision_language_base_url: http://127.0.0.1:11434
vision_language_model: gemma4:e2b
