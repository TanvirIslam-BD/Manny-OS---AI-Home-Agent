environment: production
hardware_mode: real
audio_device: default
mcp_mode: remote_http
mcp_token_storage: keyring
camera_enabled: false
face_recognition_enabled: false
api_host: 127.0.0.1
api_port: 8765
log_level: INFO
data_directory: /opt/manny/data
stt_backend: whisper_cpp
tts_backend: espeak_ng
voice_default_language: auto
whisper_cpp_binary: /opt/manny/whisper.cpp/build/bin/whisper-cli
whisper_cpp_model: /opt/manny/models/ggml-base.bin
whisper_cpp_threads: 4
whisper_cpp_timeout_seconds: 90
espeak_ng_binary: /usr/bin/espeak-ng
llm_backend: llama_cpp
llm_base_url: http://127.0.0.1:8080
llm_model: gemma-3-4b-it
llm_timeout_seconds: 60
llm_max_tokens: 320
llm_context_turns: 6

# Camera deferred: no sensor selected yet, and vision is the largest latency and
# memory cost on the device. Set camera_enabled true, install a multimodal model
# with its projector, and switch this to llama_cpp to turn scene description on.
vision_language_backend: none
vision_language_base_url: http://127.0.0.1:8080
vision_language_model: gemma-3-4b-it
